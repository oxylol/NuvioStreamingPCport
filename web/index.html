<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#020404">
  <meta name="description" content="Nuvio Media Hub - Stream your favorite content">
  <title>Nuvio</title>
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020404;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    /* Scrollbar styling for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0A0C0C;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #020404;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
    }

    .loading-text {
      color: #2d9cdb;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .loading-spinner {
      margin-top: 32px;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(45, 156, 219, 0.2);
      border-top-color: #2d9cdb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Focus styles for accessibility */
    :focus-visible {
      outline: 2px solid #2d9cdb;
      outline-offset: 2px;
    }

    /* Prevent text selection on UI elements */
    button, [role="button"] {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Custom drag region for macOS title bar */
    .title-bar-drag-region {
      -webkit-app-region: drag;
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="loading-screen">
    <svg class="loading-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" stroke="#2d9cdb" stroke-width="2" fill="none" opacity="0.3"/>
      <circle cx="50" cy="50" r="35" stroke="#2d9cdb" stroke-width="2" fill="none" opacity="0.5"/>
      <circle cx="50" cy="50" r="25" fill="#2d9cdb" opacity="0.8"/>
      <polygon points="45,38 45,62 65,50" fill="#020404"/>
    </svg>
    <div class="loading-text">NUVIO</div>
    <div class="loading-spinner"></div>
  </div>
  <script>
    // Hide loading screen when app is ready
    window.hideLoadingScreen = function() {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
        setTimeout(() => {
          loadingScreen.remove();
        }, 300);
      }
    };
  </script>
</body>
</html>
